<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>404 — Page not found</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcfcfc;
        --fg: #1a1d23;
        --muted: #6b7280;
        --primary: #23814f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0e14;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --primary: #3fbf7f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 6rem);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 30rem;
      }
      a {
        margin-top: 0.5rem;
        display: inline-block;
        padding: 0.6rem 1.25rem;
        border-radius: 0.625rem;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>This page doesn't exist. It may have moved, or the link was mistyped.</p>
    <a href="/">Back to home</a>
  </body>
</html>
