name: Security Audit

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC
  workflow_dispatch:

# Least privilege: the default token only reads the repo. The issue-reporting
# job elevates to issues:write for itself, so pull_request runs (including
# forks) never get write scope.
permissions:
  contents: read

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        id: audit
        run: pnpm audit --audit-level=high

      - name: Check for outdated packages
        if: always()
        run: pnpm outdated || true

  # One self-managed issue, identified by a hidden marker so this never touches
  # issues opened by anything else. Failure updates/opens it; success closes it.
  # (No new issue per run — that was the #136–#158 spam.) Skipped on
  # pull_request: PRs surface the failure via the required check, not an issue.
  report:
    name: Report audit result
    needs: security-audit
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Report audit result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARKER = '<!-- security-audit-automated -->'
            const failed = '${{ needs.security-audit.result }}' === 'failure'
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            })
            const managed = open.filter(i => i.body && i.body.includes(MARKER))

            if (failed) {
              const body = [
                MARKER,
                `\`pnpm audit --audit-level=high\` failed on ${new Date().toISOString()}.`,
                '',
                `Run log: ${runUrl}`,
              ].join('\n')
              if (managed.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: managed[0].number,
                  body: `Still failing as of ${new Date().toISOString()}.\n\nRun log: ${runUrl}`,
                })
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🔒 Security vulnerabilities detected',
                  body,
                  labels: ['security', 'automated'],
                })
              }
            } else {
              for (const issue of managed) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Resolved — \`pnpm audit\` is clean as of ${new Date().toISOString()}. Closing.\n\nRun log: ${runUrl}`,
                })
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                })
              }
            }
